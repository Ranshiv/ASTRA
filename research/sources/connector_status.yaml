  chandra: {transport: netclient, status: metadata-only}
  des: {transport: netclient, status: mock-only}
  desi: {transport: tap, status: mock-only}
  erosita: {transport: netclient, status: metadata-only}
  galex: {transport: netclient, status: metadata-only}
  herschel: {transport: netclient, status: metadata-only}
  ogle: {transport: netclient, status: mock-only}
  panstarrs: {transport: netclient, status: metadata-only}
  rubin_tap: {transport: tap, status: dormant, note: "credential-gated Rubin/LSST TAP"}
