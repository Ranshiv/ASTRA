# Per-module status audit (roadmap acceptance gate 9).
#
# `status` values:
#   benchmarked      - has a real benchmark result bound via ResultRecord
#                       (see research/results/).
#   production-wired  - imported/dispatched from rpc.py; used by the running
#                       application, not gated behind a benchmark.
#   infrastructure     - shared utility code (HTTP client, logging, CLI
#                       entrypoint), not itself a scientific module.
#   candidate-only     - present in the codebase, not yet wired into rpc.py
#                       by the heuristic below; includes every *_eval.py
#                       study harness, which is intentionally never wired
#                       into the runtime path.
#   dormant / blocked / synthetic-only - not distinguished by this
#                       heuristic pass; cross-reference docs/DEFERRED.txt's
#                       existing [PARTIAL]/[KNOWN] entries for that detail
#                       on any specific module before treating it as fully
#                       characterized here.
#
# Generated by grepping each engine/astra/*.py module's own name against
# rpc.py's source text -- a fast, mechanical first pass, not a manual
# per-module review. "production-wired" means "rpc.py's dispatch table
# imports or names this module", not "this module is scientifically
# validated" -- cross-reference docs/DEFERRED.txt and this file's
# "benchmarked" entries for validation status specifically. Reconcile
# against docs/DEFERRED.txt's 50 [PARTIAL] / 13 [KNOWN] entries before
# treating any single module's status here as final.

