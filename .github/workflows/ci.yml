name: CI

# Runs the four checks the repo already wires up as npm scripts
# (typecheck, test:ui, test:py, test:rs) on every push and PR. ASTRA is a
# Windows-first desktop app (README: "Requires Windows 11 ... Visual Studio
# Build Tools"), so the runner matches that rather than Linux.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:ui -- --run

  engine:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.lock
      - run: python -m venv .venv
      - run: .venv\Scripts\pip.exe install -r engine/requirements.lock
      - run: .venv\Scripts\pip.exe install -e engine
      # `live` tests hit real external services and are excluded here by the
      # marker registered in tests/conftest.py; everything else never
      # touches the network or the real ASTRA data root.
      - run: .venv\Scripts\python.exe -m pytest tests -q -m "not live"

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npm ci
      - run: cargo test --manifest-path src-tauri/Cargo.toml
