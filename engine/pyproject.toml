[project]
name = "astra-engine"
version = "0.1.0"
description = "ASTRA scientific engine — astronomical survey and transient analysis"
requires-python = ">=3.12,<3.13"

dependencies = [
    "astropy==8.0.1",
    "astroquery==0.4.11",
    "lightkurve==2.6.0",
    "numpy==2.5.2",
    "scipy==1.18.0",
    "polars==1.43.2",
    "pyarrow==25.0.1",
    "duckdb==1.5.5",
    "dask[complete]==2026.7.1",
    "scikit-learn==1.9.0",
    "plotly==6.9.0",
    "matplotlib==3.11.1",
    # gw.py: astropy-healpix (not healpy -- no native Windows wheel) builds a
    # sky-localization map from public GW posterior samples; gwosc is the
    # GWOSC event catalog client; h5py reads the posterior-samples file.
    "astropy-healpix==2.0.1",
    "gwosc==0.8.3",
    "h5py==3.16.0",
    # tess_psf.py: forward PSF scene-model fitting (IntegratedGaussianPRF +
    # PSFPhotometry) for candidate-scale deblending of TESS TPFs.
    "photutils==3.0.0",
]

[project.optional-dependencies]
# nvidia-cuda-runtime-cu12 ships the CUDA headers cupy.RawKernel needs to
# JIT-compile a kernel (gpu_periodogram.py). Without it, kernel compilation
# depends on a system CUDA toolkit being installed and CUDA_PATH finding it --
# config.ensure_cuda_path() covers that case, but a pip wheel install should
# not require one. Pinned to CuPy 14.1.1's reported CUDA build (12.9).
gpu = ["torch==2.13.0", "cupy-cuda12x==14.1.1", "nvidia-cuda-runtime-cu12==12.9.*"]
dev = ["pytest==9.1.1", "pyinstaller==6.22.1"]
# multiband_hier.py's latent-period GP model. CPU-only (no CUDA needed) but
# still gated as opt-in/dev-only like torch above: it is a research
# diagnostic never wired into scoring/RPC, and build-engine.ps1 strips it
# from the packaged CPU release the same way it strips torch.
#
# emcee: microlensing_fit.py's posterior sampler (pure-Python MIT wheel, no
# build risk). VBMicrolensing: microlensing.py's binary-lens magnification
# (a C++ extension -- confirmed to ship a real cp312 win_amd64 wheel, unlike
# healpy/nifty-ls whose missing Windows wheels blocked earlier work here).
# Point-lens fitting needs NEITHER: its forward model is pure numpy and its
# optimiser is scipy.optimize, already a core dependency.
#
# cryptography: reproducibility_bundle.py's Ed25519 signing/verification
# (roadmap item 40). No pure-stdlib asymmetric-signature primitive exists in
# CPython; this is the standard, audited choice (PyCA, ships a real cp312
# win_amd64 wheel via a vendored OpenSSL, no local build toolchain needed).
research = ["celerite2==0.3.3", "emcee==3.1.6", "VBMicrolensing==5.5", "cryptography==50.0.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["astra*"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = ["."]
markers = [
    "live: hits a real external service; skipped by default (see tests/conftest.py), run explicitly with -m live",
]
